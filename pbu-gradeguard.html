<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PBU GradeGuard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0}
/* Layout: satu lajur tengah; header ringkas, tab, kemudian panel. Muat naik menjadi skrin utama bila belum ada data. */
:root{
  /* Gaya sama dengan portal Unit Peperiksaan dan Penilaian: biru tua, merah, latar biru-kelabu muda (sentiasa terang) */
  --navy:#13306b; --navy-dark:#0c2150; --red:#e5213a; --red-dark:#c81930;
  --bg:#f3f6fb; --surface:#ffffff; --surface-2:#eaf0f8; --line:#d5deec;
  --fg:#1d2b4a; --fg-2:#46557a; --fg-3:#5d6b86;
  --accent:#e5213a; --accent-fg:#ffffff; --accent-soft:#fdeaec;
  --series:#2a5cb0; --grid:#e3e9f3;
  --bad-bg:#fbe8e8; --bad-fg:#a02323; --warn-bg:#fff2d3; --warn-fg:#7a5000; --ok-bg:#e2f4e2; --ok-fg:#0d640d; --info-bg:#e2edfa; --info-fg:#184f95;
  --font:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
.wrap{max-width:1200px;margin-inline:auto;padding-inline:clamp(16px,3vw,32px);padding-block:22px 56px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-2)}
.hide-sm{display:initial}

/* header: sama dengan bar navigasi portal */
.site{background:var(--navy);color:#fff}
.site-in{max-width:1200px;margin-inline:auto;padding:10px clamp(16px,3vw,32px);display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo-img{height:46px;width:auto;max-width:none;flex-shrink:0;display:block}
.brand-text{border-left:1px solid rgba(255,255,255,.35);padding-left:14px;min-width:0}
.brand h1{font-size:17px;font-weight:700;letter-spacing:.01em;line-height:1.25}
.brand p{margin:2px 0 0;color:rgba(255,255,255,.88);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.site :focus-visible{outline-color:#fff}
.site .btn{color:var(--fg)}
.site .btn.primary{color:var(--accent-fg)}
.site .btn:hover{border-color:#fff}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{background:var(--red-dark);border-color:var(--red-dark)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.btn.sm{padding:5px 10px;font-size:12.5px}

/* upload / empty */
.drop{border:2px dashed var(--line);background:var(--surface);border-radius:10px;padding:clamp(24px,5vw,48px);display:grid;gap:18px;justify-items:start;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop h2{font-size:22px;font-weight:700;color:var(--navy);padding-left:12px;border-left:4px solid var(--red)}
.drop p{margin:0;max-width:62ch;color:var(--fg-2)}
.checks{display:grid;grid-template-columns:1fr;gap:8px;margin:0;padding:0;list-style:none;width:100%;text-align:left}
.cgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;width:100%;margin-top:8px;text-align:left}
.cg{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-2);margin:0 0 10px;font-weight:600}
.checks li{padding-left:22px;position:relative;color:var(--fg-2);font-size:13px}
.checks li::before{content:"✓";position:absolute;left:0;color:var(--ok-fg);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px}
.banner{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn-fg);margin-bottom:14px;font-size:13px;font-weight:500}
.errbox{padding:10px 14px;border-radius:8px;background:var(--bad-bg);color:var(--bad-fg);margin-bottom:14px;font-size:13px}
.errbox ul{margin:6px 0 0;padding-left:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 6px 3px 12px;font-size:12.5px;font-weight:600}
.chip button{border:0;background:transparent;color:var(--fg-3);border-radius:50%;width:20px;height:20px;line-height:1;padding:0}
.chip button:hover{background:var(--surface-2);color:var(--fg)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--fg-2);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .count{font-size:11.5px;background:var(--surface-2);color:var(--fg-2);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.tab .count.bad{background:var(--bad-bg);color:var(--bad-fg)}
.tab .count.warn{background:var(--warn-bg);color:var(--warn-fg)}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;text-align:left;display:block;width:100%}
button.kpi:hover{border-color:var(--accent)}
.kpi .k{font-size:12px;color:var(--fg-2);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:28px;font-weight:700;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--navy)}
.kpi .s{font-size:12.5px;color:var(--fg-2);margin-top:2px}

/* panels */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:14px;margin-bottom:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel h3{font-size:15px;font-weight:700;margin-bottom:2px;color:var(--navy);padding-left:10px;border-left:4px solid var(--red)}
.panel .sub{color:var(--fg-2);font-size:12.5px;margin:0 0 10px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--fg-2);font-family:var(--font);font-size:11px}
.chart .val{fill:var(--fg);font-weight:600}
.chart .bar{fill:var(--series)}
.chart .bar.crit{fill:var(--series)}
.chart line.g{stroke:var(--grid);stroke-width:1}
.chart .axis{stroke:var(--line)}
.chart .hit{fill:transparent}
.chart .hit:hover ~ .bar,.chart g:hover .bar{filter:brightness(1.15)}

/* toolbar + table */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.field{display:grid;gap:3px}
.field label{font-size:11.5px;font-weight:600;color:var(--fg-2);text-transform:uppercase;letter-spacing:.05em}
.field select,.field input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;min-width:130px;max-width:100%}
.field input[type=search]{min-width:min(100%,220px)}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:600;font-size:13px;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--navy);font-size:12px;font-weight:700;color:#fff;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
th button{border:0;background:transparent;padding:0;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;font-weight:inherit;display:inline-flex;gap:4px;align-items:center}
th button:hover{color:#fff;text-decoration:underline}
th .ar{font-size:10px;opacity:.7}
td.r,th.r{text-align:right}
tbody tr:nth-child(even) td{background:#f7f9fd}
tbody tr:hover td{background:#e8eff9}
tr:last-child td{border-bottom:0}
.count-line{color:var(--fg-2);font-size:12.5px;margin:8px 2px}
.empty{padding:28px;text-align:center;color:var(--fg-2)}

/* pills */
.pill{display:inline-flex;gap:5px;align-items:center;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap;margin:1px 4px 1px 0}
.pill::before{font-weight:700}
.pill.bad{background:var(--bad-bg);color:var(--bad-fg)} .pill.bad::before{content:"✕"}
.pill.warn{background:var(--warn-bg);color:var(--warn-fg)} .pill.warn::before{content:"!"}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)} .pill.ok::before{content:"✓"}
.pill.info{background:var(--info-bg);color:var(--info-fg)} .pill.info::before{content:"•"}

/* audit */
.rule{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.rule summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.rule summary::-webkit-details-marker{display:none}
.rule summary::before{content:"▸";color:var(--fg-3);font-size:12px;width:12px}
.rule[open] summary::before{content:"▾"}
.rule .t{font-weight:600;flex:1;min-width:200px}
.rule .body{padding:0 16px 14px}
.rule .why{margin:0 0 10px;color:var(--fg-2);font-size:13px;max-width:80ch}
.rules-doc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:14px}
.rules-doc summary{cursor:pointer;font-weight:600}
.rules-doc ul{margin:10px 0 0;padding-left:20px;color:var(--fg-2)}
.rules-doc li{margin-bottom:4px}
.allgood{padding:14px 16px;border-radius:8px;background:var(--ok-bg);color:var(--ok-fg);font-weight:600;margin-bottom:14px}

/* misc */
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 10px;border-radius:6px;font-size:12px;max-width:260px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;z-index:30;display:none;max-width:calc(100% - 32px)}
.progress{color:var(--fg-2);font-size:13px;margin:6px 0}
@media (max-width:560px){.chart text{font-size:16px}.hide-sm{display:none}.kpi .v{font-size:24px}.wrap{padding-block:14px 40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function parseSession(title){
  const m=String(title).match(/SEMESTER\s+(\d+)\s+SESI\s+([IVX]+)\s*:?\s*(\d{4})\s*\/\s*(\d{2,4})/i);
  if(!m)return{label:'Sesi tidak dikenal',short:'?',sem:null,ord:0};
  const r=m[2].toUpperCase(),y=parseInt(m[3],10),y2=m[4].length===2?m[3].slice(0,2)+m[4]:m[4];

function parseSheet(ws,fileName,sheetName){

  const head=rows[hi],last=courses[courses.length-1].col+4;
  const sc={};
  for(let j=last+1;j<Math.min(head.length,last+12);j++){const h=clean(head[j]);if(h)sc[h]=j}

  for(let i=0;i<Math.min(hi,8);i++){const t=clean((rows[i]||[])[0]);
    if(/^PROGRAM/i.test(t))program=t.split(':').slice(1).join(':').trim();
    if(/^KEPUTUSAN/i.test(t))title=t}
  if(!program)program=sheetName||fileName.replace(/\.[^.]+$/,'');
  const students=[];let lastIdx=hi;
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]||[];
    if(/^\d+$/.test(clean(r[0]))){
      lastIdx=i;
      const s={kelas:program,bil:parseInt(clean(r[0]),10),id:clean(r[1]),nama:clean(r[2]),akj:clean(r[3]),res:{}};
      for(const c of courses){
        const seg=[0,1,2,3,4].map(k=>r[c.col+k]);
        const o={pb:cellVal(seg[0]),pa:cellVal(seg[1]),jm:cellVal(seg[2]),nm:cellVal(seg[3]),st:clean(seg[4]).replace(/\s/g,'')};
        if(o.pb==null&&o.pa==null&&o.jm==null&&o.nm==null&&!o.st)continue;
        s.res[c.code]=o}
      for(const k of ['JJKS','JJKL','JJKK','JKTA','PNM','HPNM','KPTN']){const v=r[sc[k]];s[k]=k==='KPTN'?clean(v):(isNum(v)?v:null)}
      students.push(s)}}
  const footer={};
  for(let i=lastIdx+1;i<rows.length;i++){
    const cells=(rows[i]||[]).map(clean).filter(Boolean);
    for(let k=0;k<cells.length-1;k++){
      if(['KB','KB~','KS','KS~','LP','LP~','GB','GB~'].includes(cells[k])&&/^(\d+|-)$/.test(cells[k+1]))
        footer[cells[k]]=cells[k+1]==='-'?0:parseInt(cells[k+1],10)}}
  const session=parseSession(title);
  return{program,title,session,key:session.label+'|'+program,file:fileName,courses,students,footer};
}
async function readFiles(files){
  S.errors=[];
  const list=[...files];let n=0;
  for(const f of list){
    n++;setProgress('Membaca fail '+n+' / '+list.length+': '+f.name);
    await new Promise(r=>setTimeout(r,0));
    try{
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array'});
      let got=0;
      for(const sn of wb.SheetNames){
        const c=parseSheet(wb.Sheets[sn],f.name,sn);
        if(c&&c.students.length){
          if(S.sample){S.all=[];S.sample=false}
          const ix=S.all.findIndex(x=>x.key===c.key);
          if(ix>=0)S.all[ix]=c;else S.all.push(c);
          got++}}
      if(!got)S.errors.push(f.name+': format tidak dikenali (tiada baris pengepala "Bil." atau kod kursus).');
    }catch(e){S.errors.push(f.name+': tidak dapat dibaca ('+(e&&e.message?e.message:'ralat')+').')}
  }
  setProgress('');
  S.all.sort((a,b)=>a.session.ord-b.session.ord||a.program.localeCompare(b.program,'ms',{numeric:true}));
  boot();
  if(list.length)toast(S.errors.length?'Selesai dengan '+S.errors.length+' fail bermasalah.':list.length+' fail dibaca.');
}

function expectedComp(r){
  const a=isNum(r.pa)&&r.pa<CFG.passComponent,b=isNum(r.pb)&&r.pb<CFG.passComponent;
  return a&&b?'PAPB':a?'PA':b?'PB':'';
}
const baseOf=k=>String(k||'').replace('~','').trim();
function calcStanding(s){
  const why=[],h=s.HPNM,p=s.PNM;
  if(isNum(h)&&h<1.6)why.push('HPNM '+f2(h)+' kurang 1.60 (6.1.4 i)');
  if(isNum(p)&&p<1.0)why.push('PNM '+f2(p)+' kurang 1.00 (6.1.4 ii)');
  if(why.length)return{st:'GB',why};
  if(isNum(h)&&h<2.0)return{st:'KS',why:['HPNM '+f2(h)+' antara 1.60 dan 2.00']};
  return{st:'KB',why:[]};
}
function analyze(){
  const cl=S.classes,courses=new Map(),issues=[];
  const multi=new Set(cl.map(c=>c.session.label)).size>1;
  cl.forEach(c=>{c.label=multi?c.program+' · '+c.session.short:c.program;c.students.forEach(s=>{s.kelas=c.label;s.sesi=c.session.label;s.ord=c.session.ord;s.sem=c.session.sem})});
  const labels=new Set(cl.map(c=>c.label));
  for(const k of [S.f.gagal,S.f.pelajar,S.li])if(k.kelas&&!labels.has(k.kelas))k.kelas='';
  if(S.f.status.kelas&&!labels.has(S.f.status.kelas))S.f.status.kelas='';
  if(S.f.akj.kelas&&!labels.has(S.f.akj.kelas))S.f.akj.kelas='';
  cl.forEach(c=>c.courses.forEach(k=>{if(!courses.has(k.code))courses.set(k.code,{code:k.code,name:k.name,credit:k.credit,n:0,fail:0,jmSum:0,jmN:0,paSum:0,paN:0,hasPA:false})}));
  /* kesan pemberat PB */
  const W={};
  for(const [code] of courses){
    const pts=[];
    cl.forEach(c=>c.students.forEach(s=>{const r=s.res[code];if(r&&isNum(r.pb)&&isNum(r.pa)&&isNum(r.jm))pts.push([r.pb,r.pa,r.jm])}));
    let best=null;
    if(pts.length>=CFG.minWeightPts){
      for(let w=30;w<=95;w+=5){let m=0;for(const p of pts)if(Math.round(p[0]*w/100+p[1]*(100-w)/100+1e-9)===p[2])m++;if(!best||m>best.m)best={w,m}}}
    W[code]=CFG.weights[code]!=null?CFG.weights[code]:(best&&best.m/pts.length>=0.9?best.w:null);
  }
  const add=(rule,s,code,detail)=>issues.push({rule,kelas:s.kelas,id:s.id,nama:s.nama,kod:code||'',detail});
  const fails=[],studs=[],seen=new Map();
  const gHist={};GRADES.forEach(g=>gHist[g[2]]=0);
  for(const c of cl){
    const kpt={};
    for(const s of c.students){
      const d={fails:[],cred:0,credOk:0,qp:0};
      for(const [code,r] of Object.entries(s.res)){
        const m=courses.get(code);m.n++;
        /* Latihan Industri (JM = LI): tiada PB/PA/NM, tidak masuk PNM/JJKS */
        const isLI=r.jm==='LI';
        if(!isLI){d.cred+=m.credit;if(isNum(r.nm))d.qp+=m.credit*r.nm}
        if(isNum(r.jm)){m.jmSum+=r.jm;m.jmN++}
        if(isNum(r.pa)){m.paSum+=r.pa;m.paN++;m.hasPA=true}
        if(r.jm!=null&&!isLI)gHist[gradeInfo(r.jm)[2]]++;
        /* markah sah */
        for(const [k,v] of [['PB',r.pb],['PA',r.pa],['JM',r.jm]]){
          if(v==null)continue;
          if(isNum(v)){if(v<0||v>100)add('markah',s,code,k+' = '+v+' (luar 0–100)')}
          else if(!CFG.allowedText.includes(v))add('markah',s,code,k+' = "'+v+'" (bukan nombor)')}
        /* NM */
        if(isNum(r.jm)&&isNum(r.nm)){const e=gradeOf(r.jm);if(Math.abs(e-r.nm)>0.005)add('nilai',s,code,'JM '+r.jm+' → NM dijangka '+e+', dalam fail '+r.nm)}
        else if((r.jm==='TH'||r.jm==='TL')&&isNum(r.nm)&&r.nm!==0)add('nilai',s,code,'JM '+r.jm+' → NM dijangka 0, dalam fail '+r.nm);
        /* JM */
        if(isNum(r.pb)&&isNum(r.jm)){
          if(isNum(r.pa)){if(W[code]!=null){const e=Math.round(r.pb*W[code]/100+r.pa*(100-W[code])/100+1e-9);
            if(e!==r.jm)add('jm',s,code,'PB '+r.pb+' / PA '+r.pa+' ('+W[code]+':'+(100-W[code])+') → JM dijangka '+e+', dalam fail '+r.jm)}}
          else if(r.pa==null&&r.jm!==r.pb)add('jm',s,code,'Hanya PB ('+r.pb+') → JM dijangka '+r.pb+', dalam fail '+r.jm)}
        /* tanda gagal */
        const exp=isLI?'':expectedComp(r),mm=r.st.match(/^C(\d+):(PAPB|PA|PB)$/),flagged=!!r.st;
        if(exp&&!flagged)add('tiada-tanda',s,code,'PB '+(r.pb??'-')+' / PA '+(r.pa??'-')+' → patut gagal '+exp);
        else if(flagged&&!exp&&!isLI)add('tanda-lebih',s,code,'Ditanda '+r.st+' tetapi PB '+(r.pb??'-')+' / PA '+(r.pa??'-')+' tidak bawah '+CFG.passComponent);
        else if(flagged&&mm&&!isLI&&mm[2]!==exp)add('tanda-lebih',s,code,'Ditanda '+mm[2]+' tetapi markah menunjukkan '+exp);
        if(flagged){
          const comp=mm?mm[2]:'';
          const reason=isLI?'Gagal Latihan Industri':r.jm==='TH'?'Tidak hadir':r.jm==='TL'?'Tidak layak':comp==='PA'?'Gagal PA':comp==='PB'?'Gagal PB':comp==='PAPB'?'Gagal PA & PB':'Gagal';
          const f={kelas:s.kelas,id:s.id,nama:s.nama,kod:code,kursus:m.name,kredit:m.credit,pb:r.pb,pa:r.pa,jm:r.jm,nm:r.nm,
            kali:mm?'Kali '+mm[1]:'',gred:gradeInfo(r.jm)[2],gstatus:gradeInfo(r.jm)[3],comp,reason,tanda:r.st,pnm:s.PNM,kptn:s.KPTN};
          d.fails.push(f);fails.push(f);m.fail++}
        else d.credOk+=m.credit;
      }
      d.pnm=d.cred?d.qp/d.cred:0;
      /* peringkat pelajar */
      if(d.cred>0&&isNum(s.PNM)&&Math.abs(d.pnm-s.PNM)>CFG.pnmTol)add('pnm',s,'','PNM dijangka '+d.pnm.toFixed(2)+', dalam fail '+s.PNM);
      if(isNum(s.JJKS)&&Math.abs(d.cred-s.JJKS)>0.001)add('jjks',s,'','Jumlah kredit kursus '+d.cred+', JJKS dalam fail '+s.JJKS);
      if(isNum(s.JJKL)&&Math.abs(d.credOk-s.JJKL)>0.001&&![3,6].some(x=>Math.abs(Math.abs(d.credOk-s.JJKL)-x)<0.001))add('jjkl',s,'','Kredit tidak gagal '+d.credOk+', JJKL dalam fail '+s.JJKL+' (gagal: '+(d.fails.map(f=>f.kod).join(', ')||'tiada')+')');
      if(s.KPTN&&/^(KB|KS|LP)/.test(s.KPTN)){const til=s.KPTN.includes('~');const nf=d.fails.filter(f=>f.jm!=='LI').length;if(til!==(nf>0))add('kptn',s,'','KPTN "'+s.KPTN+'" tetapi kursus gagal = '+nf)}
      {const nms=Object.values(s.res).map(r=>r.nm).filter(isNum),minNM=nms.length?Math.min(...nms):null;
       const ci=(s.KPTN==='KB'||s.KPTN==='LP')&&isNum(s.PNM)&&s.PNM>=CFG.akjPnm,cii=minNM!=null&&minNM>=2,ciii=isNum(s.JJKS)&&s.JJKS>=CFG.akjCredit;
       s.ak={i:ci,ii:cii,iii:ciii,minNM,kss:ci&&cii&&!ciii&&isNum(s.JJKS)&&s.JJKS>=CFG.akjCreditKSS,ok:ci&&cii&&ciii};
       const hasAkj=s.akj==='**',expect=s.ak.ok||(hasAkj&&s.ak.kss);
       if(expect!==hasAkj){const miss=[];
         if(!s.ak.i)miss.push('syarat i (KPTN '+(s.KPTN||'-')+', PNM '+f2(s.PNM)+')');
         if(!s.ak.ii)miss.push('syarat ii (NM terendah '+(minNM==null?'-':minNM)+')');
         if(!s.ak.iii)miss.push('syarat iii (JJKS '+(isNum(s.JJKS)?s.JJKS:'-')+')');
         add('akj',s,'',hasAkj?'Ada ** tetapi tidak memenuhi '+miss.join(', '):'Memenuhi semua syarat tetapi tiada **')}}
      s.calc=calcStanding(s);
      {const b=baseOf(s.KPTN);if((b==='KB'||b==='KS')&&s.calc.st!==b)add('standing',s,'','Dalam fail '+s.KPTN+', dikira '+s.calc.st+' (HPNM '+f2(s.HPNM)+', PNM '+f2(s.PNM)+')')}
      if(s.KPTN)kpt[s.KPTN]=(kpt[s.KPTN]||0)+1;
      if(s.id){const key=s.sesi+'|'+s.id;if(seen.has(key)){add('pendua',s,'','Juga dalam '+seen.get(key));}else seen.set(key,s.kelas)}
      s.d=d;studs.push(s);
    }
    for(const k of Object.keys(c.footer||{})){
      if(c.footer[k]!==(kpt[k]||0))issues.push({rule:'footer',kelas:c.label,id:'',nama:'(jadual hujung fail)',kod:'',detail:k+': jadual '+c.footer[k]+', lajur KPTN '+(kpt[k]||0)})}
  }
  const byId=new Map();
  studs.forEach(x=>{if(!x.id)return;if(!byId.has(x.id))byId.set(x.id,[]);byId.get(x.id).push(x)});
  const people=[];
  for(const [id,arr] of byId){
    arr.sort((a,b)=>a.ord-b.ord);
    let streak=0;const cf={};
    arr.forEach(x=>{
      const b=baseOf(x.KPTN)||x.calc.st;streak=b==='KS'?streak+1:0;x.ksStreak=streak;
      x.d.fails.forEach(f=>{const o=cf[f.kod]||(cf[f.kod]={n:0,att:0});o.n++;const m=String(f.tanda).match(/^C(\d+)/);if(m)o.att=Math.max(o.att,parseInt(m[1],10))})});
    const last=arr[arr.length-1];let st=last.calc.st;const why=last.calc.why.slice();
    if(last.ksStreak>=3){st='GB';why.push('KS '+last.ksStreak+' kali berturut-turut (6.1.4 iv)')}
    for(const [kod,o] of Object.entries(cf)){const t=Math.max(o.n,o.att);if(t>=3){st='GB';why.push('Gagal '+kod+' '+t+' kali (6.1.4 iii)')}}
    const risk=[],h=last.HPNM,pn=last.PNM,M=CFG.margin;
    if(st!=='GB'){
      if(last.ksStreak===2)risk.push('KS kali ke-3 menjadi GB');
      if(st==='KS'&&isNum(h)&&h<1.6+M)risk.push('HPNM hampir 1.60');
      if(st==='KB'&&isNum(h)&&h<2+M)risk.push('HPNM hampir 2.00');
      if(isNum(pn)&&pn>=1&&pn<1+M)risk.push('PNM hampir 1.00')}
    people.push({id,nama:last.nama,arr,last,st,why,risk,ksStreak:last.ksStreak,failTot:arr.reduce((a,x)=>a+x.d.fails.length,0)});
  }
  const sessions=[...new Map(cl.map(c=>[c.session.label,c.session])).values()].sort((a,b)=>a.ord-b.ord);
  const byRule={};RULES.forEach(r=>byRule[r.id]=[]);issues.forEach(i=>byRule[i.rule].push(i));
  S.A={courses,W,issues,byRule,fails,studs,gHist,people,sessions};
}

function niceStep(v){if(v<=1)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function niceMax(v){const st=niceStep(v/4);return st*Math.ceil(v/st)}
function topRound(x,y,w,h,r){r=Math.min(r,w/2,h);return 'M'+x+','+(y+h)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+w-r)+'Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+'V'+(y+h)+'Z'}
function rightRound(x,y,w,h,r){r=Math.min(r,h/2,w);return 'M'+x+','+y+'H'+(x+w-r)+'Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+'V'+(y+h-r)+'Q'+(x+w)+','+(y+h)+' '+(x+w-r)+','+(y+h)+'H'+x+'Z'}
function gradeChart(){
  const H=S.A.gHist,vals=GRADES.map(g=>H[g[2]]),tot=vals.reduce((a,b)=>a+b,0);
  const W=640,Hh=270,L=46,R=10,T=22,B=50,iw=W-L-R,ih=Hh-T-B,mx=niceMax(Math.max(...vals,1));
  let s='<svg class="chart" viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="Taburan gred bagi semua keputusan kursus">';
  const gs=niceStep(mx/4);
  for(let v=0;v<=mx+1e-9;v+=gs){const y=T+ih-ih*v/mx;
    s+='<line class="g" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(v)+'</text>'}
  const bw=iw/vals.length;
  vals.forEach((v,i)=>{
    const g=GRADES[i],h=ih*v/mx,x=L+i*bw+bw*0.16,w=bw*0.68,y=T+ih-h;
    s+='<g data-tip="Gred '+g[2]+' ('+GRANGE[g[2]]+', NM '+g[1].toFixed(2)+', '+g[3]+'): '+v+' keputusan ('+pct(v,tot)+'%)">';
    s+='<rect class="hit" x="'+(L+i*bw)+'" y="'+T+'" width="'+bw+'" height="'+ih+'"/>';
    if(v>0)s+='<path class="bar" d="'+topRound(x,y,w,h,4)+'"/><text class="val" x="'+(x+w/2)+'" y="'+(y-5)+'" text-anchor="middle">'+v+'</text>';
    s+='<text x="'+(x+w/2)+'" y="'+(T+ih+16)+'" text-anchor="middle">'+g[2]+'</text></g>'});
  s+='<line class="axis" x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+ih)+'" y2="'+(T+ih)+'"/>';
  s+='<text x="'+(L+iw/2)+'" y="'+(Hh-8)+'" text-anchor="middle">Gred (ikut Jumlah Markah)</text></svg>';
  return s;
}
function classChart(rows){
  const W=640,rowH=26,L=64,R=110,T=8,B=30,n=rows.length,Hh=T+B+n*rowH;
  const mx=Math.max(10,Math.ceil(Math.max(...rows.map(r=>r.pctFail),0)/10)*10),iw=W-L-R;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="Peratus pelajar yang ada kursus gagal bagi setiap kelas">';
  const step=mx<=20?5:10;
  for(let v=0;v<=mx;v+=step){const x=L+iw*v/mx;
    s+='<line class="g" x1="'+x+'" x2="'+x+'" y1="'+T+'" y2="'+(T+n*rowH)+'"/><text x="'+x+'" y="'+(T+n*rowH+16)+'" text-anchor="middle">'+v+'%</text>'}
  rows.forEach((r,i)=>{
    const y=T+i*rowH,w=iw*r.pctFail/mx;
    s+='<g data-tip="'+esc(r.kelas)+': '+r.withFail+' daripada '+r.n+' pelajar ada kursus gagal ('+r.pctFail+'%)">';
    s+='<rect class="hit" x="0" y="'+y+'" width="'+W+'" height="'+rowH+'"/>';
    s+='<text x="'+(L-8)+'" y="'+(y+rowH/2+4)+'" text-anchor="end">'+esc(r.kelas)+'</text>';
    if(w>0)s+='<path class="bar" d="'+rightRound(L,y+4,w,rowH-8,4)+'"/>';
    s+='<text class="val" x="'+(L+w+6)+'" y="'+(y+rowH/2+4)+'">'+r.withFail+'/'+r.n+' · '+r.pctFail+'%</text></g>'});
  s+='<line class="axis" x1="'+L+'" x2="'+L+'" y1="'+T+'" y2="'+(T+n*rowH)+'"/></svg>';
  return s;
}

  return S.classes.map(c=>{

      pnms=st.map(s=>s.PNM).filter(isNum),cnt=k=>st.filter(s=>(s.KPTN||'').startsWith(k)).length;

      avg:pnms.length?pnms.reduce((a,b)=>a+b,0)/pnms.length:null,max:pnms.length?Math.max(...pnms):null,
      kb:st.filter(s=>s.KPTN==='KB').length,kbt:st.filter(s=>s.KPTN==='KB~').length,ks:cnt('KS'),gb:cnt('GB'),akj:st.filter(s=>s.akj==='**').length}});

/* ---------- pelajar gagal ---------- */
function gagalRows(){
  const f=S.f.gagal,q=f.q.toLowerCase();
  return S.A.fails.filter(x=>(!f.kelas||x.kelas===f.kelas)&&(!f.kod||x.kod===f.kod)&&(!f.sebab||x.reason===f.sebab)&&
    (!q||x.nama.toLowerCase().includes(q)||x.id.toLowerCase().includes(q)));

function gagalStudents(rows){
  const m=new Map();

  return[...m.values()];
}

const stPill=st=>st==='GB'?pill('bad','GB'):st==='KS'?pill('warn','KS'):pill('ok','KB');
function pkInfo(p){
  const x=p.last,f=x.d.fails;if(f.length!==1)return null;
  const pr=progOf(x.kelas),thr=parseFloat(S.li.thr[pr]);if(!isFinite(thr)||!isNum(x.JJKK))return null;
  const ft=f[0],total=x.JJKK+(isNum(ft.kredit)?ft.kredit:0);
  const sat=isNum(ft.pa)&&ft.pa>0&&ft.jm!=='TH'&&ft.jm!=='TL'&&ft.jm!=='LI';
  return{ft,thr,jjkk:x.JJKK,total,sat,cukup:total>=thr,ok:total>=thr&&sat};
}
const pkList=()=>S.A.people.map(p=>({p,k:pkInfo(p)})).filter(r=>r.k&&r.k.ok);
const pkNear=()=>S.A.people.map(p=>({p,k:pkInfo(p)})).filter(r=>r.k&&r.k.cukup&&!r.k.sat);
const pkTxt=k=>k.ft.kod+' ('+k.ft.kredit+' kredit): JJKK '+k.jjkk+' + '+k.ft.kredit+' = '+k.total+' (minimum '+k.thr+'), PA '+(k.sat?'diduduki ('+k.ft.pa+')':k.ft.jm==='LI'?'tiada (Latihan Industri)':'tidak diduduki');
function statusRows(){
  const f=S.f.status,q=f.q.toLowerCase();
  return S.A.people.filter(p=>(!f.st||(f.st==='risiko'?(p.risk.length>0&&p.st!=='GB'):f.st==='pk'?!!(pkInfo(p)&&pkInfo(p).ok):p.st===f.st))&&(!f.kelas||p.last.kelas===f.kelas)&&(!f.sesi||p.last.sesi===f.sesi)&&(!q||p.nama.toLowerCase().includes(q)||p.id.toLowerCase().includes(q)));
}

/* ---------- perbandingan sesi ---------- */
function bandingRows(){
  const f=S.f.banding,q=f.q.toLowerCase(),t0=parseFloat(f.thr),thr=isFinite(t0)?t0:0.3;
  return S.A.people.map(p=>{
    const n=p.arr.length,a=p.arr[n-1],b=n>1?p.arr[n-2]:null;
    const dP=b&&isNum(a.PNM)&&isNum(b.PNM)?+(a.PNM-b.PNM).toFixed(2):null;
    const dH=b&&isNum(a.HPNM)&&isNum(b.HPNM)?+(a.HPNM-b.HPNM).toFixed(2):null;
    const trend=dP==null?'satu':dP<=-thr?'turun':dP>=thr?'naik':'sama';
    return{p,dP,dH,trend};
  }).filter(r=>(!f.trend||r.trend===f.trend)&&(!q||r.p.nama.toLowerCase().includes(q)||r.p.id.toLowerCase().includes(q)));
}
const sgn=v=>v==null?'–':(v>0?'+':'')+v.toFixed(2);

  const A=S.A,f=S.f.banding;
  if(A.sessions.length<2)return '<div class="panel"><h3>Belum ada sesi kedua</h3><p class="sub" style="margin-top:6px;max-width:70ch">Muat naik fail keputusan dari sesi lain (contohnya Sesi I 2025/2026) menggunakan butang Tambah fail. Pelajar yang sama dipadankan melalui No. Pendaftaran, dan perubahan PNM, HPNM serta kedudukan akan dipaparkan di sini. Sesi dibaca daripada tajuk lembaran, jadi kelas dengan nama sama dalam sesi berlainan tidak menggantikan satu sama lain.</p><p class="sub">Sesi dimuat naik sekarang: '+A.sessions.map(x=>esc(x.label)).join(', ')+'</p></div>';
  return '<p class="muted" style="margin:0 0 12px;max-width:85ch">Membandingkan sesi terkini dengan sesi sebelumnya bagi setiap pelajar. Sesi yang dimuat naik: '+A.sessions.map(x=>esc(x.label)).join(', ')+'.</p>'+
   '<div class="tools"><div class="field"><label for="bd-trend">Tren PNM</label><select id="bd-trend">'+opt('','Semua',f.trend)+opt('turun','Menurun',f.trend)+opt('naik','Meningkat',f.trend)+opt('sama','Hampir sama',f.trend)+opt('satu','Satu sesi sahaja',f.trend)+'</select></div>'+

/* ---------- anugerah ketua jabatan (**) ---------- */
function akjState(x){
  const has=x.akj==='**';
  if(has&&(x.ak.ok||x.ak.kss))return{k:'sah',t:x.ak.ok?'Sah':'Sah (KSS?)'};
  if(has)return{k:'salah',t:'Tidak layak'};
  if(x.ak.ok)return{k:'tiada',t:'Layak, tiada **'};
  if(x.ak.kss)return{k:'kss',t:'Semak KSS'};
  return{k:'bukan',t:''};
}
function akjRows(){
  const f=S.f.akj,q=f.q.toLowerCase();
  return S.A.studs.filter(x=>{
    const a=akjState(x),has=x.akj==='**';
    const rel=f.st===''?((has||x.ak.ok)&&(+x.JJKS||0)>=12):f.st==='ada'?has:f.st==='beza'?(a.k==='salah'||a.k==='tiada'):f.st==='kss'?a.k==='kss':true;
    return rel&&(!f.kelas||x.kelas===f.kelas)&&(!f.sesi||x.sesi===f.sesi)&&(!q||x.nama.toLowerCase().includes(q)||x.id.toLowerCase().includes(q))});
}

  return '<section class="panel" style="margin-bottom:14px"><h3>Syarat penganugerahan Anugerah Ketua Jabatan</h3>'+
   '<p class="sub">Pelajar bertanda ** dalam lembaran keputusan. Ketiga-tiga syarat mesti dipenuhi pada semester yang dinilai.</p>'+

/* ---------- kelayakan latihan industri ---------- */
const progOf=k=>{const m=String(k).match(/^[A-Za-z]{3}/);return m?m[0].toUpperCase():''};
function liRows(){
  const f=S.li;
  return S.A.studs.map(x=>{
    const pr=progOf(x.kelas),thr=parseFloat(f.thr[pr]),kk=x.JJKK,fu=parseFloat(f.full[pr]);
    const has=isFinite(thr)&&isNum(kk),hasF=isFinite(fu);
    return{s:x,kelas:x.kelas,id:x.id,nama:x.nama,prog:pr,kk,thr:isFinite(thr)?thr:null,baki:has?Math.max(0,thr-kk):null,full:hasF?fu:null,
      status:!has?'tiada':hasF&&kk>=fu?'lulus':kk===thr?'layak':kk<thr?'belum':'antara',gagal:x.d.fails.length}});
}
function liFiltered(){
  const f=S.li,q=f.q.toLowerCase();
  return liRows().filter(r=>(!f.kelas||r.kelas===f.kelas)&&(!f.status||r.status===f.status)&&(!q||r.nama.toLowerCase().includes(q)||r.id.toLowerCase().includes(q)));
}

/* ============ Eksport (kapasiti downloads) ============ */
let dlPromise=null;
function getDL(){
  if(!dlPromise)dlPromise=(window.claude&&window.claude.use)?Promise.resolve(window.claude.use('downloads')).catch(()=>null):Promise.resolve({save:async({filename,data})=>{const u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}});
  return dlPromise;
}
async function saveXlsx(name,sheets){
  const dl=await getDL();
  if(!dl){toast('Muat turun tidak tersedia.');return}
  const wb=XLSX.utils.book_new();
  sheets.forEach(s=>{
    const ws=XLSX.utils.aoa_to_sheet(s.rows);
    const w=s.rows[0].map((_,i)=>({wch:Math.min(48,Math.max(8,...s.rows.slice(0,60).map(r=>String(r[i]==null?'':r[i]).length)))}));
    ws['!cols']=w;XLSX.utils.book_append_sheet(wb,ws,s.name.slice(0,31))});
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  try{await dl.save({filename:name,data:new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})});toast('Fail dimuat turun.')}
  catch(e){toast(e&&e.code==='declined'?'Simpan dibatalkan.':'Tidak dapat menyimpan: '+(e&&e.message?e.message:'ralat'))}
}
const today=()=>new Date().toISOString().slice(0,10);
function doExport(kind){
  if(kind==='gagal')return saveXlsx('pelajar-gagal-'+today()+'.xlsx',[thtlSheet(),zeroSheet(),gagalSheet()]);
  if(kind==='audit')return saveXlsx('laporan-audit-'+today()+'.xlsx',[auditSheet()]);
  if(kind==='pelajar')return saveXlsx('semua-pelajar-'+today()+'.xlsx',[pelajarSheet()]);
  if(kind==='akj')return saveXlsx('anugerah-ketua-jabatan-'+today()+'.xlsx',[akjSheet()]);
  if(kind==='status')return saveXlsx('kedudukan-'+today()+'.xlsx',[statusSheet()]);
  if(kind==='banding')return saveXlsx('perbandingan-sesi-'+today()+'.xlsx',[bandingSheet()]);
  if(kind==='li')return saveXlsx('kelayakan-LI-'+today()+'.xlsx',[liSheet()]);
  if(kind==='semua'){
    const f=S.f.gagal,keep=f.view;f.view='entri';
    const all=ringkasanSheets().concat([thtlSheet(),zeroSheet(),gagalSheet(),statusSheet(),akjSheet(),auditSheet(),liSheet(),pelajarSheet()]).concat(S.A.sessions.length>1?[bandingSheet()]:[]);f.view=keep;
    return saveXlsx('PBU-GradeGuard-'+today()+'.xlsx',all)}
}

/* ============ Data contoh (rekaan, bukan pelajar sebenar) ============ */
function makeSample(){
  let seed=20260930;const rnd=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296};
  const courses=[{code:'DBM20153',name:'DISCRETE MATHEMATICS',credit:3,w:60},{code:'DFC20283',name:'DATABASE FUNDAMENTALS',credit:3,w:70},
    {code:'DFC20293',name:'NETWORK AND DATA COMMUNICATION',credit:3,w:70},{code:'DFC20313',name:'WEB DESIGN TECHNOLOGY',credit:3,w:70},
    {code:'DFK20013',name:'CYBERSECURITY FUNDAMENTALS',credit:3,w:70},{code:'MPU23272',name:'PENDIDIKAN MORAL',credit:2,w:100}];
  const classes=[];
  for(const prog of ['CONTOH-A','CONTOH-B','CONTOH-C']){
    const students=[];
    for(let i=1;i<=24;i++){
      const s={kelas:prog,bil:i,id:'00CONTOH'+prog.slice(-1)+String(i).padStart(3,'0'),nama:'PELAJAR CONTOH '+prog.slice(-1)+String(i).padStart(2,'0'),akj:'',res:{}};
      let cred=0,qp=0,credOk=0,nf=0;
      for(const c of courses){
        const pb=Math.round(55+rnd()*40);let pa=c.w===100?null:Math.round(20+rnd()*75);
        if(pa!=null&&rnd()<0.06)pa=Math.round(rnd()*38);
        const jm=pa==null?pb:Math.round(pb*c.w/100+pa*(100-c.w)/100+1e-9),nm=gradeOf(jm);
        const failed=pa!=null&&pa<40;
        s.res[c.code]={pb,pa,jm,nm,st:failed?'C1:PA':''};
        cred+=c.credit;qp+=c.credit*nm;if(failed)nf++;else credOk+=c.credit}
      s.JJKS=cred;s.JJKL=credOk;s.JJKK=cred;s.JKTA=cred;s.PNM=Math.round(qp/cred*100)/100;s.HPNM=s.PNM;
      s.KPTN=nf?'KB~':'KB';s.akj=(s.PNM>=3.5&&!nf)?'**':'';
      students.push(s)}
    classes.push({program:prog,title:'DATA CONTOH (REKAAN)',session:{label:'Sesi CONTOH',short:'CONTOH',sem:2,ord:1},key:'Sesi CONTOH|'+prog,file:'contoh',courses:courses.map((c,i)=>({col:i,code:c.code,name:c.name,credit:c.credit})),students,footer:null});
  }
  /* sengaja tinggalkan dua ralat supaya tab Semakan ada contoh */
  const a=classes[0].students[3];a.PNM=Math.min(4,+(a.PNM+0.4).toFixed(2));
  const b=classes[1].students[5];const k=Object.keys(b.res)[1];b.res[k].nm=b.res[k].nm===4?3:4;
  classes.forEach(c=>{const cnt={};c.students.forEach(s=>cnt[s.KPTN]=(cnt[s.KPTN]||0)+1);c.footer=cnt});
  return classes;
}

const TABS=[['ringkasan','Ringkasan'],['gagal','Pelajar gagal'],['status','Status'],['akj','Anugerah KJ'],['kursus','Kursus'],['semakan','Semakan data'],['li','Kelayakan LI'],['pelajar','Semua pelajar'],['banding','Perbandingan sesi']];
function boot(){
  if(S.prog&&!S.all.some(c=>progOf(c.program)===S.prog))S.prog='';
  S.classes=S.prog?S.all.filter(c=>progOf(c.program)===S.prog):S.all.slice();
  const has=S.classes.length>0;
  if(has)analyze();else S.A=null;
  const title=has&&S.classes[0].title&&!S.sample?(S.A.sessions.length>1?'Keputusan: '+S.A.sessions.map(x=>x.label).join(' · '):S.classes[0].title):'';
  $('#subtitle').textContent='Semakan Lembaran Markah Penilaian Akhir';
  $('#topActions').innerHTML=has?'<button class="btn" data-add>Tambah fail</button><button class="btn primary" data-export="semua">Eksport semua</button>':'';
  $('#notices').innerHTML=(S.errors.length?'<div class="errbox"><strong>Sebahagian fail tidak dapat dibaca</strong><ul>'+S.errors.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul></div>':'')+
    (S.sample&&has?'<div class="banner"><span>Anda sedang melihat data contoh yang direka. Ini bukan pelajar sebenar.</span><button class="btn sm" data-clear>Kosongkan dan muat naik fail sebenar</button></div>':'');
  render();
  applyDL();
}
function render(){
  const main=$('#main');
  if(!S.all.length){
    main.innerHTML='<section class="drop" id="dz"><h2>Muat naik lembaran keputusan</h2>'+
     '<p>Pilih satu atau banyak fail Excel (.xls atau .xlsx), satu fail bagi setiap kelas. Fail dibaca di pelayar anda dan tidak dihantar ke mana-mana pelayan.</p>'+
     '<div class="row"><button class="btn primary" data-add>Pilih fail</button></div>'+
     '<div class="progress" id="progress"></div>'+
     '<div class="cgroups"><div><h3 class="cg">Semakan data</h3><ul class="checks"><li>Nilai Mata (NM) mengikut skala gred rasmi</li><li>Jumlah Markah (JM) mengikut pemberat PB:PA setiap kursus</li><li>PA atau PB bawah 40 mesti ada tanda gagal, dan sebaliknya</li><li>PNM sepadan dengan NM dan kredit</li><li>JJKS dan JJKL sepadan dengan kursus diambil dan kursus gagal</li><li>Markah dalam julat 0–100 atau kod khas (TH, TL, MC dan lain-lain)</li><li>Tanda ~ pada KPTN sepadan dengan kursus gagal</li><li>Tanda ** sepadan dengan syarat Anugerah Ketua Jabatan</li><li>KB/KS dalam fail sepadan dengan HPNM dan PNM</li><li>Jadual ringkasan hujung fail sepadan dengan lajur KPTN</li><li>No. Pendaftaran pendua</li></ul></div><div><h3 class="cg">Pelajar dan status</h3><ul class="checks"><li>Senarai pelajar gagal mengikut kelas, kursus dan sebab</li><li>Kes TH/TL dan kes PB = 0 atau PA = 0 dalam jadual berasingan</li><li>Gagal dan Diberhentikan (GB) dan Kedudukan Bersyarat (KS)</li><li>Pelajar hampir ambang GB atau KS</li><li>Penilaian Khas (PK): cukup jam, gagal satu kursus, PA diduduki</li><li>Anugerah Ketua Jabatan (**) dengan syarat dan pelajar KSS</li><li>Kelayakan Latihan Industri dan Lulus Penuh mengikut program</li></ul></div><div><h3 class="cg">Analisis dan eksport</h3><ul class="checks"><li>Statistik kelas, kursus dan taburan gred</li><li>Penapis program (DDT, DIT dan lain-lain) untuk semua tab</li><li>Perbandingan sesi: perubahan PNM dan HPNM setiap pelajar</li><li>Kursus yang sama gagal tiga kali dan KS tiga sesi berturut-turut</li><li>Eksport Excel bagi setiap tab atau semua sekali</li></ul></div></div></section>';
    return;
  }
  const A=S.A,ralat=A.issues.filter(i=>RULES.find(r=>r.id===i.rule).sev==='ralat').length;
  const counts={gagal:A.fails.length,semakan:A.issues.length,li:liRows().filter(r=>r.status==='layak').length,status:A.people.filter(x=>x.st!=='KB'||(pkInfo(x)&&pkInfo(x).ok)).length,banding:A.sessions.length,akj:A.studs.filter(x=>x.akj==='**').length,pelajar:A.studs.length,kursus:A.courses.size};
  const progs=[...new Set(S.all.map(c=>progOf(c.program)))].sort();
  let h='<div id="progress" class="progress"></div>'+(progs.length>1?'<div class="chips" role="group" aria-label="Program"><span class="muted" style="font-size:12px;font-weight:600;margin-right:4px">PROGRAM</span>'+[''].concat(progs).map(pr=>{const n=S.all.filter(c=>!pr||progOf(c.program)===pr).reduce((a,c)=>a+c.students.length,0);return '<button class="btn sm'+((S.prog===pr)?' primary':'')+'" data-psel="'+esc(pr)+'" aria-pressed="'+(S.prog===pr)+'">'+(pr||'Semua')+' <span class="num" style="opacity:.75">'+n+'</span></button>'}).join('')+'</div>':'')+'<div class="chips">'+S.classes.map(c=>'<span class="chip">'+esc(c.label)+' <span class="muted num">'+c.students.length+'</span><button data-remove="'+esc(c.key)+'" aria-label="Buang '+esc(c.label)+'">✕</button></span>').join('')+
    '<button class="btn sm ghost" data-clear>Kosongkan semua</button></div>';
  h+='<div class="tabs" role="tablist">'+TABS.map(([k,l])=>'<button class="tab" role="tab" data-tab="'+k+'" aria-selected="'+(S.tab===k)+'">'+l+(counts[k]!=null?'<span class="count'+(k==='semakan'?(ralat?' bad':(A.issues.length?' warn':'')):'')+'">'+counts[k]+'</span>':'')+'</button>').join('')+'</div><div id="pane"></div>';
  main.innerHTML=h;
  renderPane();
}
function renderPane(){
  const p=$('#pane');if(!p)return;
  const t=S.tab;
  p.innerHTML=t==='ringkasan'?renderRingkasan():t==='gagal'?renderGagal():t==='kursus'?renderKursus():t==='semakan'?renderSemakan():t==='li'?renderLI():t==='status'?renderStatus():t==='banding'?renderBanding():t==='akj'?renderAkj():renderPelajar();
  if(t==='ringkasan')fillKelas();if(t==='gagal')fillGagal();if(t==='kursus')fillKursus();if(t==='pelajar')fillPelajar();if(t==='li')fillLI();if(t==='status')fillStatus();if(t==='banding')fillBanding();if(t==='akj')fillAkj();
  if(t==='semakan')document.querySelectorAll('details.rule[open]').forEach(d=>fillRule(d.dataset.rule));
  applyDL();
}
function refreshBody(id){
  if(id.startsWith('audit-')){const r=id.slice(6),el=$('#ar-'+r);if(el){el.dataset.done='';fillRule(r)}return}
  if(id==='kelas'||id==='tindakan')return fillKelas();
  if(id==='gagal'||id==='gagalp'||id==='thtl'||id==='zero')return fillGagal();
  if(id==='kursus')return fillKursus();
  if(id==='pelajar')return fillPelajar();
  if(id==='li')return fillLI();
  if(id==='status')return fillStatus();
  if(id==='banding')return fillBanding();
  if(id==='akj')return fillAkj();
}
async function applyDL(){
  const dl=await getDL();
  document.querySelectorAll('[data-export]').forEach(b=>b.hidden=!dl);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,summary');if(!t)return;
  if(t.matches('[data-add]'))return $('#fileInput').click();
  if(t.matches('[data-sample]')){S.all=makeSample();S.sample=true;S.errors=[];return boot()}
  if(t.matches('[data-clear]')){S.all=[];S.prog='';S.sample=false;S.errors=[];S.sort={};S.showAll={};return boot()}
  if(t.dataset.remove){S.all=S.all.filter(c=>c.key!==t.dataset.remove);return boot()}
  if(t.dataset.psel!==undefined&&t.matches('[data-psel]')){S.prog=t.dataset.psel;return boot()}
  if(t.dataset.tab){S.tab=t.dataset.tab;return render()}
  if(t.dataset.goto){S.tab=t.dataset.goto;return render()}
  if(t.dataset.sort){const id=t.dataset.sort,k=t.dataset.key,c=S.sort[id];S.sort[id]=c&&c.key===k?{key:k,dir:-c.dir}:{key:k,dir:1};return refreshBody(id)}
  if(t.dataset.showall){S.showAll[t.dataset.showall]=true;return refreshBody(t.dataset.showall)}

  if(t.dataset.sev!==undefined&&t.closest('.seg')){S.f.audit.sev=t.dataset.sev;return renderPane()}

});
